name: Infrastructure CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Validate Terraform without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          for directory in bootstrap stacks/core stacks/external-simulator; do
            terraform -chdir="$directory" init -backend=false -input=false -no-color
            terraform -chdir="$directory" validate -no-color
          done
      - name: Test deployment safeguards
        run: python3 -m unittest discover -s tests/delivery -v
      - name: Check shell syntax
        run: bash -n .github/scripts/deploy.sh
