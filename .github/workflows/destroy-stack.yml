name: Teardown stack helper
on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      operation:
        type: string
        required: true
      expected_commit:
        type: string
        required: true
      confirmation:
        type: string
        required: false
permissions:
  contents: read
jobs:
  teardown:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: terraform-${{ inputs.stack }}
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PAGER: ''
      TF_IN_AUTOMATION: 'true'
      STACK: ${{ inputs.stack }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TEARDOWN_ENABLED: ${{ vars.TEARDOWN_ENABLED }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ROLE_ARN: ${{ (inputs.operation == 'destroy' || (vars.TEARDOWN_ENABLED == 'true' && vars.AWS_DESTROY_ROLE_ARN != '')) && vars.AWS_DESTROY_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
      STACK_CONFIG_JSON: ${{ inputs.stack == 'core' && secrets.CORE_CONFIG_JSON || secrets.SIMULATOR_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Validate teardown intent before AWS authentication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 -c 'import os,json,sys; sys.path.insert(0,".github/scripts"); from teardown import intent; intent(os.environ["OPERATION"],os.environ["STACK"],json.loads(os.environ["STACK_CONFIG_JSON"]),os.environ.get("CONFIRMATION",""),os.environ.get("TEARDOWN_ENABLED","false"))'
          : "${ROLE_ARN:?Separate destroy role must be provisioned/configured for destroy}"
          : "${AWS_ACCOUNT_ID:?Missing account}"
          : "${TF_STATE_BUCKET:?Missing state bucket}"
          if [[ "$OPERATION" == destroy ]]; then
            suffix="$(jq -r '.project_name + "-" + .environment' <<< "$STACK_CONFIG_JSON")"
            test "$ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/$suffix-github-destroy"
          fi
          echo "::add-mask::$AWS_ACCOUNT_ID"
          echo "::add-mask::$TF_STATE_BUCKET"
          echo "::add-mask::$ROLE_ARN"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          role-session-name: final-teardown-${{ github.run_id }}
          role-duration-seconds: 3600
          retry-max-attempts: 2
      - name: Generate deletion-only plan and optionally apply the saved plan
        run: bash .github/scripts/teardown.sh
